<!-- Main Content Area -->
<main>

    <h1 class="page-title">Add a Class</h1>

<!-- Form for creating a new class -->
    <form class="form-container container">
        <div class="form-section">
            <label for="course-name">Course Name *</label>
            <input type="text" placeholder="Social Studies" name="course-name" id="course-name" required>
        </div>

        <div class="form-section">
            <label for="grade">Grade *</label>
            <select id="grade" name="grade" required>
                <option value="">Select a grade</option>
                <option value="5">Grade 5</option>
                <option value="6">Grade 6</option>
                <option value="7">Grade 7</option>
                <option value="8">Grade 8</option>
            </select>
        </div>

        <div class="form-section">
            <label for="class-section">Section *</label>
            <select id="class-section" name="class-section" required>
                <option value="">Select a section</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>

        <div class="form-section">
            <label for="course-description">Course Description</label>
            <textarea placeholder="Write a short description.." name="course-description" id="course-description"></textarea>
        </div>

        <div class="form-btn-container">
            <button type="button" class="form-btn cancel-btn" name="cancel-btn">Cancel</button>
            <button type="submit" class="form-btn" name="create-class">Create Class</button>
        </div>

    </form>

</main>
